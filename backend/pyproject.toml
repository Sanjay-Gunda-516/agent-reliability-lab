[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Testing, evaluation and regression platform for an AI customer-support agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "anthropic>=2.3,<3",
    "langgraph>=1.2,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running PostgreSQL (docker compose up -d db)",
    "live: calls the real Claude API (costs money); run with -m live",
]
filterwarnings = [
    # langsmith (a langgraph dependency) still uses an API deprecated in Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith.*",
    # Raised inside langsmith.wrappers when it imports its own deprecated submodule.
    "ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise shadow the alembic package.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]
